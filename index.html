<!doctype html>
<html>
  <head>
    <title>Meet PRO</title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#757575" />
    <!-- viewport-fit=cover in every mode so env(safe-area-inset-*) resolves on
         notched phones; both pages pad themselves with those insets. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no<% } %>"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="logo.svg" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
